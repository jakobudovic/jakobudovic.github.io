<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jakob Udovič · Projects</title>
  <meta name="description" content="All of Jakob Udovič's live projects in one place.">
  <style>
    :root { color-scheme: light dark; --fg: #111; --muted: #666; --bg: #fafafa; --card: #fff; --line: #e5e5e5; }
    @media (prefers-color-scheme: dark) { :root { --fg: #eee; --muted: #999; --bg: #111; --card: #1a1a1a; --line: #2a2a2a; } }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 720px; margin: 0 auto; padding: 4rem 1.25rem; }
    h1 { margin: 0 0 .25rem; font-size: 2rem; }
    p.lead { margin: 0 0 2.5rem; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
    a { display: block; padding: 1rem 1.25rem; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
    a:hover { border-color: var(--muted); transform: translateY(-1px); }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    strong { display: block; }
    span { color: var(--muted); font-size: .9rem; }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } a:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Jakob Udovič</h1>
    <p class="lead">Everything I've built and host here, in one place.</p>
    <ul>

      <li><a href="/naraven-dom/"><strong>Naraven Dom</strong><span>Natural Cottage</span></a></li>
      <li><a href="/DigitalSchool/"><strong>Digital School</strong><span>Digital School project</span></a></li>
      <li><a href="/AoC/"><strong>Advent of Code 2021</strong><span>Puzzle solutions</span></a></li>
    </ul>
  </main>
</body>
</html>
